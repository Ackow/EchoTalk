# EchoTalk 2.0 管理后台 Nginx 配置（国内服务器直连，免备案、免跨域）
# 用法：
#   1. 本地 admin/ 打包：npm run build
#   2. 上传 dist：scp -r admin/dist/* ubuntu@110.40.206.154:/var/www/echotalk-admin/
#   3. 安装配置：sudo cp /opt/echotalk/backend/deploy/nginx-admin.conf /etc/nginx/sites-available/echotalk-admin
#                sudo ln -sf /etc/nginx/sites-available/echotalk-admin /etc/nginx/sites-enabled/echotalk-admin
#                sudo nginx -t && sudo systemctl reload nginx
#   4. 云安全组 / UFW 放行 8889 端口，浏览器访问 http://110.40.206.154:8889

server {
    listen 8889;
    listen [::]:8889;

    root /var/www/echotalk-admin;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
