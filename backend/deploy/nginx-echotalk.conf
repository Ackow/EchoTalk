# EchoTalk API Nginx 反向代理配置
# 安装：sudo cp nginx-echotalk.conf /etc/nginx/sites-available/echotalk
#       sudo ln -s /etc/nginx/sites-available/echotalk /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS：sudo certbot --nginx -d api.your-domain.com   （自动改写本文件并续期）

server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;   # 改成你的域名或服务器 IP 对应的域名

    # 上传体积上限（语音等文件），按需调整
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
