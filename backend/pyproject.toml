[project]
name = "echotalk-backend"
version = "2.0.0"
description = "EchoTalk 2.0 account API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "lightrag-hku==1.5.7",
    "openai==3.23.0",
    "pymysql[rsa]>=1.1,<2.0",
    "pypdf==6.16.2",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
