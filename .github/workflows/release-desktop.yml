name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npm run pack:mac
          - os: windows-latest
            cmd: npm run pack:win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and package Electron app
        working-directory: frontend
        env:
          # 如打包桌面端需指向线上后端，请在 GitHub Secrets 中配置 VITE_API_BASE_URL（直连 HTTP IP 时再加 VITE_ALLOW_HTTP=1）
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ALLOW_HTTP: ${{ secrets.VITE_ALLOW_HTTP }}
        run: ${{ matrix.cmd }}

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/dist_electron/${{ steps.version.outputs.version }}/*.exe
            frontend/dist_electron/${{ steps.version.outputs.version }}/*.dmg
            frontend/dist_electron/${{ steps.version.outputs.version }}/*.zip
            frontend/dist_electron/${{ steps.version.outputs.version }}/*.blockmap
            frontend/dist_electron/${{ steps.version.outputs.version }}/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
